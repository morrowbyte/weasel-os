name: Boat Nix CI

on:
  push:
    branches: [main]
    paths: ['**/*.nix', 'flake.lock', '.github/workflows/namespace.yml', '.github/scripts/**']
  pull_request:
    paths: ['**/*.nix', 'flake.lock', '.github/workflows/namespace.yml', '.github/scripts/**']
  workflow_dispatch:
    inputs:
      build:
        description: Build both host systems after evaluation
        type: boolean
        default: false
      probe_only:
        description: Measure runner storage without evaluating or building hosts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weasel-os-boat-ci
  cancel-in-progress: false
  queue: max

jobs:
  hosts:
    if: vars.CI_ENABLED == 'true'
    runs-on: boat
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        host: [nixy-laptop, nixy-desktop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Boat runner and record source identity
        run: python3 .github/scripts/assert-boat-runner.py
      - name: Preserve runner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: boat-routing-${{ matrix.host }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: boat-runner.json
          retention-days: 7
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 4
            cores = 2
      - name: Restore bounded Nix store through Actions cache
        if: github.event_name != 'workflow_dispatch' || !inputs.build
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.host }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ matrix.host }}-
          gc-max-store-size-linux: 8G
          save: ${{ github.event_name != 'pull_request' }}
      - name: Measure runner storage
        run: |
          df -h / /nix /tmp
          df -B1 --output=target,size,used,avail / /nix /tmp
      - name: Evaluate locked flake and host
        if: github.event_name != 'workflow_dispatch' || !inputs.probe_only
        run: |
          nix eval --no-write-lock-file --raw .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath > host.drv
          # The flake imports generated sources during evaluation; allow their realization.
          nix flake check --no-write-lock-file
      - name: Inspect and build evaluated host
        if: github.event_name == 'workflow_dispatch' && inputs.build && !inputs.probe_only
        run: |
          nix build --dry-run --no-link "$(cat host.drv)^*"
          nix build --no-link --print-build-logs "$(cat host.drv)^*"
      - name: Confirm lockfile preservation
        run: git diff --exit-code -- flake.lock
